<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% block head %}{% endblock %}

    <title>{% block title %}Kodama School{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/menu.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/modal_apply.css') }}">

    {% block styles %}{% endblock %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="{% block body_id %}home{% endblock %}">

{% block content %}{% endblock %}

{% include "includes/modal_apply.html" %}

<script>
    const images = "{{ url_for('static', path='/images') }}";
</script>
<script src="{{ url_for('static', path='js/hero_form.js') }}" defer></script>
<script src="{{ url_for('static', path='js/desktop.js') }}" defer></script>

{% block scripts %}{% endblock %}
</body>
</html>
