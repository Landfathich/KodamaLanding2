{% from "includes/course_card.html" import course_card with context %}

<section id="popular-courses" class="popular-courses">
    <div class="pc-container">
        <h2 class="pc-title">Популярные курсы</h2>
        <p class="pc-subtitle">Выберите то, что интересно вашему ребёнку</p>

        <div class="pc-grid">
            {% for course in popular_courses %}
                {{ course_card(course) }}
            {% endfor %}
        </div>

        <div class="pc-all">
            <a href="/courses" class="pc-all-btn">Смотреть все курсы →</a>
        </div>
    </div>
</section>
