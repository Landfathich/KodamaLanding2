<section class="direction-projects">
    <div class="dpr-decor dpr-decor-1"></div>
    <div class="dpr-decor dpr-decor-2"></div>
    <div class="dpr-decor dpr-decor-3">🎨</div>
    <div class="dpr-decor dpr-decor-4">🚀</div>

    <div class="dpr-container">
        <h2 class="dpr-title">Что создаёт ребёнок</h2>
        <p class="dpr-subtitle">Примеры проектов, которые делают ученики направления</p>

        <div class="dpr-carousel">
            <button class="dpr-arrow dpr-arrow-left" id="dpr-prev">←</button>

            <div class="dpr-track-wrapper">
                <div class="dpr-track" id="dpr-track">
                    {% for project in projects %}
                    <div class="dpr-card">
                        <div class="dpr-card-bg"></div>
                        <div class="dpr-icon">{{ project.icon }}</div>
                        <h3>{{ project.title }}</h3>
                        <p>{{ project.text }}</p>
                        <div class="dpr-tag">Проект</div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <button class="dpr-arrow dpr-arrow-right" id="dpr-next">→</button>
        </div>
    </div>
</section>
