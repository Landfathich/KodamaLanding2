<section id="apply">
    <div id="submit-app-content">
        <img id="submit-app-photo" src="{{ url_for('static', path='/images/default_submit.webp') }}" alt="Иконка курса">
        <div id="submit-app-block">
            <h3 id="submit-app-title">Запишитесь на первый урок</h3>
            <form id="submit-app-form" method="post">
                <select id="course-select" name="course">
                    <option value="" selected disabled hidden>Выберите курс</option>
                    <option value="figma">Figma</option>
                    <option value="computer-literacy">Компьютер с нуля</option>
                    <option value="scratch">Scratch</option>
                    <option value="roblox">Roblox Studio</option>
                    <option value="blender">Моделирование в Blender</option>
                    <option value="web-development">Создание сайтов</option>
                    <option value="python">Программирование на Python</option>
                    <option value="unity">Создание игр на Unity</option>
                    <option value="olympic-programming">Подготовка к олимпиадам по программированию</option>
                    <option value="cpp">Изучение языка C++</option>
                    <option value="dont_know">Не могу определиться</option>
                </select>

                <input type="text" id="name" name="name" placeholder="Ваше имя"
                       autocomplete="name" minlength="2" maxlength="50" required>

                <input type="tel" id="phone" name="tel" placeholder="Ваш телефон"
                       title="Введите номер телефона (только цифры, 10-15 символов)"
                       autocomplete="tel" minlength="5" maxlength="30" required>

                <input type="email" id="email" name="email" placeholder="Ваша почта"
                       autocomplete="email" required>

                <label class="privacy-policy">
                    <div class="privacy-policy-content">
                        <div class="policy-checkbox-container">
                            <input type="checkbox" id="privacy-policy-checkbox" name="privacy_policy"
                                   class="styled-checkbox" required>
                        </div>
                        <div class="policy-text-container">
                            <p>Нажимая кнопку «Отправить», я даю согласие на обработку моих персональных данных
                                в соответствии с <a href="/privacy" target="_blank">Политикой обработки персональных
                                    данных</a>.</p>
                        </div>
                    </div>
                </label>

                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <button class="submit-app-form__btn" id="submit-btn" type="submit">Отправить</button>
            </form>
        </div>
    </div>

    <div id="submit-app-modal">
        <div id="submit-app-modal-content">
            <div id="submit-app-modal-header">
                <img src="{{ url_for('static', path='/images/logo_scrolled.webp') }}" alt="Kodama"
                     id="submit-app-modal-logo">
                <h2 id="submit-app-modal-title">Спасибо за заявку!</h2>
            </div>

            <div id="submit-app-modal-body">
                <p id="submit-app-modal-message"></p>
            </div>

            <button id="btn-close-submit-app-modal" onclick="closeSubmitAppModal()">
                Закрыть
            </button>

            <p id="submit-app-modal-footer">
                До встречи на занятиях! ✨
            </p>
        </div>
    </div>

</section>
